    "shop.fluid:web": {
      "key": "75cbbe78f11acbd9",
      "fluid_hash": "e243040f9cf9",
      "fx3": "import Server;\nimport Db;\nimport Env;\nimport Json;\n\n// POST /orders: places an order from the JSON body and answers 201 with its id.\nfunction[<Request>|<Response>] @fails(IOError, ValueError, DbError) post_orders = Function(Request req) {\n    Json body = req.json() ?? Json.of(none);\n    string item = body.get(\"item\").asString() ?? \"\";\n    int? amount = body.get(\"amount\").asInt();\n    if (amount == none) {\n        return Response.json({\"error\": \"amount must be a whole number\"}, status = 400);\n    }\n    string? problem = order_problem(item, amount);\n    if (problem != none) {\n        return Response.json({\"error\": problem}, status = 400);\n    }\n    Db db = Db.open(DB_PATH)?;\n    defer { db.close(); }\n    int new_id = place_order(db, item, amount)?;\n    return Response.json({\"id\": new_id}, status = 201);\n}\n\n// GET /total: answers with the order total.\nfunction[<Request>|<Response>] @fails(IOError, DbError) get_total = Function(Request req) {\n    Db db = Db.open(DB_PATH)?;\n    defer { db.close(); }\n    int total = order_total(db)?;\n    return Response.json({\"total\": total});\n}\n\n// Creates the server: every request needs the X-Admin-Token header.\nfunction[<>|<Server>] @fails(ValueError) create_server = Function() {\n    Server s = Server.create(port = PORT);\n    s.requireHeader(\"X-Admin-Token\", Env.require(\"ADMIN_TOKEN\")?, []);\n    s.post(\"/orders\", post_orders);\n    s.get(\"/total\", get_total);\n    return s;\n}\n",
      "fx3_hash": "e407291ee99f",
      "origin": "llm",
      "assumptions": [
        "A missing or non-whole-number \"amount\" (or a body that is not JSON) is treated as a refused order and answers 400 with {\"error\": ...}; a non-string item reads as empty and is refused.",
        "Requests without the correct X-Admin-Token header get 401 from Server.requireHeader; no paths are left open. Database or pricing failures after validation answer 500."
