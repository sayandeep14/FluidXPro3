    "shop.fluid:to place order": {
      "key": "0b4fe6c23584af7d",
      "fluid_hash": "e714288208e9",
      "fx3": "from ./pricing import price_with_tax;\nimport Db;\n\n// Returns why an order is refused, or none when it is acceptable.\nfunction[<string, int>|<string?>] order_problem = Function(string item, int amount) {\n    if (item.trim() == \"\") {\n        return \"item must not be empty\";\n    }\n    if (amount < 0) {\n        return \"amount must not be negative\";\n    }\n    return none;\n}\n\n// Saves an order with its price with tax in one transaction and returns the new order id.\nfunction[<Db, string, int>|<int>] @fails(ValueError, DbError) place_order = Function(Db db, string item, int amount) {\n    string? problem = order_problem(item, amount);\n    if (problem != none) {\n        fail ValueError(problem);\n    }\n    int taxed = price_with_tax(amount)?;\n    db.begin()?;\n    result<int> inserted = db.exec(\"insert into orders (item, amount, taxed_price) values (?, ?, ?)\", [item, amount, taxed]);\n    if (inserted.isError()) {\n        db.rollback();\n        fail DbError(inserted.error.message);\n    }\n    int new_id = db.lastId();\n    db.commit()?;\n    return new_id;\n}\n",
      "fx3_hash": "1eddbdd664f5",
      "origin": "llm",
      "assumptions": [
        "Should an item consisting only of spaces count as an empty item and be refused? -> Refuse items that are empty after trimming spaces (assumed)",
        "Should an item consisting only of spaces count as an empty item and be refused? -> Refuse items that are empty after trimming spaces (assumed)",
        "place_order and order_total take the Db as their first parameter so the test can use an isolated in-memory database; handlers and the job open shop.db per call and close it with defer.",
        "Amounts are whole cents (int); the price with tax comes from price_with_tax in ./pricing and is stored in the taxed_price column alongside item and amount.",
        "Refusal rules live in order_problem (empty item, negative amount) so both place_order (fails with ValueError) and the web handler (answers 400) use the same check; an amount of 0 is accepted.",
        "The transaction is written with begin/commit/rollback so a failing insert is rolled back and passed on as DbError; price_with_tax is called before the transaction starts."
      ],
