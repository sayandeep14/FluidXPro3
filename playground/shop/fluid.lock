      "fx3": "import Db;\nimport Log;\nimport Server;\nimport Schedule;\nimport File;\nimport Path;\n\n// Writes the first migration file (the orders table) when it is not there yet.\nfunction[<>|<>] @fails(IOError) write_first_migration = Function() {\n    if (not Path.isDir(MIGRATIONS_DIR)) {\n        Path.makeDir(MIGRATIONS_DIR)?;\n    }\n    string path = Path.join(MIGRATIONS_DIR, FIRST_MIGRATION);\n    if (not File.exists(path)) {\n        File.write(path, CREATE_ORDERS_SQL)?;\n    }\n}\n\n// Entry point: migrates the database, starts the web API and runs the hourly job.\nfunction[<>|<>] @entry main = Function() {\n    try {\n        write_first_migration();\n        Db db = Db.open(DB_PATH);\n        db.migrate(MIGRATIONS_DIR);\n        db.close();\n        Server s = create_server();\n        print(f\"Shop API on port {PORT}\");\n        s.start();\n    } catch (Error e) {\n        Log.error(f\"Shop failed to start: {e.message}\");\n        exit(1);\n    }\n    Schedule.every(1h, print_order_total, name = \"print order total\");\n    Schedule.run();\n}\n",
