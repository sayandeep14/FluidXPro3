      "fluid_hash": "d12f71fbeb5f",
      "fx3": "// The mean of the student's marks, rounded to 1 decimal place (0 when there are no marks).\nfunction[<Student>|<float>] average_of = Function(Student student) {\n    if (student.marks.isEmpty()) {\n        return 0.0;\n    }\n    return round(student.marks.sum() / student.marks.size(), 1);\n}\n\nfunction[<>|<>] @test average_of_example = Function() {\n    Student ria = Student(\"Ria\", [80, 90]);\n    ensure(average_of(ria) == 85.0, \"Ria with marks 80, 90 should average 85.0\");\n}\n",
      "fx3_hash": "11a5aab053a7",
