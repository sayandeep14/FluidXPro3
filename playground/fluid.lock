      "key": "acc600b26dee4138",
      "fluid_hash": "981396abcbb4",
      "fx3": "// Prints one line per student (name, average, grade), then how many passed.\nfunction[<vector<Student>>|<>] class_report = Function(vector<Student> students) {\n    vector<Student> shown = [];\n    int passed = 0;\n    repeat(auto student in students) {\n        if (shown.contains(student)) {\n            Log.warn(f\"{student.name} is already in the report and was skipped\");\n            skip;\n        }\n        shown.add(student);\n        float avg = average_of(student);\n        string grade = grade_for(avg);\n        print(f\"{student.name}, {avg:.1}, {grade}\");\n        if (grade != \"F\") {\n            passed += 1;\n        }\n    }\n    print(f\"{passed} passed\");\n}\n",
      "fx3_hash": "20ad1088392f",
      "origin": "llm",
      "assumptions": [
