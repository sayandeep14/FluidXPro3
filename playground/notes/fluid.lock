    "notes.fluid:to add note": {
      "key": "c0896e43e1762077",
      "fluid_hash": "3bd134b40566",
      "fx3": "import Db;\nimport Time;\n\n// Saves a note with the current time and returns it with its new id.\n// Empty (after trimming) or too long text is refused with a ValueError.\nfunction[<string>|<Note>] @fails(ValueError, IOError, DbError) add_note = Function(string text) {\n    string clean = text.trim();\n    if (clean.isEmpty()) {\n        fail ValueError(\"a note can't be empty\");\n    }\n    if (clean.size() > LONGEST_NOTE) {\n        fail ValueError(f\"a note is at most {LONGEST_NOTE} characters\");\n    }\n    string created = Time.now().format(\"YYYY-MM-DD HH:mm\");\n    Db db = Db.open(DB_PATH)?;\n    defer { db.close(); }\n    db.exec(\"insert into notes (text, created) values (?, ?)\", [clean, created])?;\n    return Note(db.lastId(), clean, created);\n}\n",
      "fx3_hash": "1dd79a58e8a2",
      "origin": "llm",
      "assumptions": [
        "Refusals fail with the built-in ValueError; the length limit is checked on the trimmed text and the trimmed text is what is saved.",
        "Each function opens the database and closes it with defer; no shared connection is kept."
      ],
