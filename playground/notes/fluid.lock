    "notes.fluid:to all notes": {
      "key": "31030f14afd57170",
      "fluid_hash": "180e0f556120",
      "fx3": "import Db;\nimport Json;\n\n// Every note, newest first.\nfunction[<>|<vector<Note>>] @fails(IOError, DbError) all_notes = Function() {\n    Db db = Db.open(DB_PATH)?;\n    defer { db.close(); }\n    vector<map<string, Json>> rows = db.query(\"select id, text, created from notes order by id desc\")?;\n    vector<Note> notes = [];\n    repeat(auto row in rows) {\n        int id = row[\"id\"].asInt() ?? 0;\n        string text = row[\"text\"].asString() ?? \"\";\n        string created = row[\"created\"].asString() ?? \"\";\n        notes.add(Note(id, text, created));\n    }\n    return notes;\n}\n",
      "fx3_hash": "bf03c8f572f9",
      "origin": "llm",
      "assumptions": [
        "Newest first is ordered by id descending, since created only has minute precision."
      ],
      "questions": [],
      "answers": {},
      "guarantees": [],
      "unsupported": ""
    },
    "notes.fluid:web": {
      "key": "00f2297be5cf5c09",
      "fluid_hash": "70cc0222bdf5",
      "fx3": "import Server;\nimport Json;\nimport Log;\n\n// Turns a note into a JSON object.\nfunction[<Note>|<map<string, Json>>] note_json = Function(Note note) {\n    return {\"id\": Json.of(note.id), \"text\": Json.of(note.text), \"created\": Json.of(note.created)};\n}\n\n// GET /notes: all notes as JSON.\nfunction[<Request>|<Response>] @fails(IOError, DbError) get_notes = Function(Request req) {\n    vector<Note> notes = all_notes()?;\n    return Response.json(notes.map(note_json(currVal)));\n}\n\n// POST /notes: adds the note in \"text\" of the JSON body; 201 with the note, 400 if refused.\nfunction[<Request>|<Response>] post_notes = Function(Request req) {\n    Json body = req.json() ?? Json.of(none);\n    string text = body.get(\"text\").asString() ?? \"\";\n    Response answer = Response.error(\"could not save the note\", status = 500);\n    try {\n        Note note = add_note(text);\n        answer = Response.json(note_json(note), status = 201);\n    } catch (ValueError e) {\n        answer = Response.error(e.message, status = 400);\n    } catch (IOError e) {\n        Log.error(f\"could not save note: {e.message}\");\n        answer = Response.error(e.message, status = 500);\n    } catch (DbError e) {\n        Log.error(f\"could not save note: {e.message}\");\n        answer = Response.error(e.message, status = 500);\n    }\n    return answer;\n}\n\n// GET /health: {\"ok\": true}.\nfunction[<Request>|<Response>] get_health = Function(Request req) {\n    return Response.json({\"ok\": true});\n}\n\n// Creates the server and registers the routes.\nfunction[<>|<Server>] create_server = Function() {\n    Server s = Server.create(port = PORT);\n    s.get(\"/notes\", get_notes);\n    s.post(\"/notes\", post_notes);\n    s.get(\"/health\", get_health);\n    return s;\n}\n",
      "fx3_hash": "44c9315011cf",
      "origin": "llm",
      "assumptions": [
        "A body that is not valid JSON or has no string \"text\" is treated as empty text, so it is refused with 400.",
        "Notes are sent as JSON objects {\"id\", \"text\", \"created\"} via note_json; database errors on POST answer 500 and are logged, GET /notes failures answer 500 through the server.",
        "Notes are sent as JSON objects {\"id\", \"text\", \"created\"} via note_json. On POST, database errors answer 500 and are logged. GET /notes failures answer 500 through the server.",
        "post_notes starts with a 500 answer and each branch replaces it, with a single return at the end so every path returns a Response."
      ],
      "questions": [],
      "answers": {},
      "guarantees": [],
      "unsupported": ""
