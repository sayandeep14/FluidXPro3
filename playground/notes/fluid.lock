      "key": "a61fb5222c22217c",
      "fluid_hash": "70e9e868d776",
      "fx3": "import Db;\n\nfunction[<>|<>] @test a_refused_note_is_not_saved = Function() {\n    try {\n        create_notes_table();\n        int before = all_notes().size();\n        result<Note> r = add_note(\"   \");\n        ensure(r.isError(), \"a note with only spaces should be refused\");\n        int after = all_notes().size();\n        ensure(after == before, \"a refused note should not be saved\");\n    } catch (IOError e) {\n        panic(e.message);\n    } catch (DbError e) {\n        panic(e.message);\n    }\n}\n",
      "fx3_hash": "51757f22b224",
      "origin": "llm",
      "assumptions": [
