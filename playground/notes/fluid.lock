    "notes.fluid:on start": {
      "key": "e321d344aae7d608",
      "fluid_hash": "f52a37195252",
      "fx3": "import Db;\nimport Log;\nimport Server;\n\n// Creates the notes table if it does not exist yet.\nfunction[<>|<>] @fails(IOError, DbError) create_notes_table = Function() {\n    Db db = Db.open(DB_PATH)?;\n    defer { db.close(); }\n    db.exec(f\"create table if not exists notes (id integer primary key autoincrement, text text not null check (length(text) <= {LONGEST_NOTE}), created text not null)\")?;\n}\n\nfunction[<>|<>] @entry main = Function() {\n    try {\n        create_notes_table();\n    } catch (IOError e) {\n        Log.error(f\"could not open the database: {e.message}\");\n        exit(1);\n    } catch (DbError e) {\n        Log.error(f\"could not create the notes table: {e.message}\");\n        exit(1);\n    }\n    print(f\"Notes API on port {PORT}\");\n    Server s = create_server();\n    s.keepRunning();\n}\n",
      "fx3_hash": "a157085377a3",
      "origin": "llm",
      "assumptions": [
        "The startup message is built from PORT, giving exactly \"Notes API on port 8090\". If the table cannot be created the error is logged and the program exits with code 1 (fail-fast)."
      ],
      "questions": [],
      "answers": {},
      "guarantees": [],
      "unsupported": ""
