      "key": "7f6ca0f8a7085bfa",
      "fluid_hash": "2c0278d04f22",
      "fx3": "import Db;\nimport Server;\nimport Schedule;\nimport Log;\n\nfunction[<>|<>] @entry main = Function() {\n    try {\n        Db db = Db.open(DB_PATH);\n\n        try {\n            int applied = db.migrate(\"migrations\");\n        } catch (IOError e) {\n            try {\n                db.exec(\"\"\"create table if not exists orders (\n                    id integer primary key autoincrement,\n                    item text not null,\n                    amount_in_cents int not null,\n                    price_with_tax int not null\n                )\"\"\", []);\n            } catch (DbError e2) {\n                Log.error(f\"schema setup failed: {e2.message}\");\n            }\n        } catch (DbError e) {\n            try {\n                db.exec(\"\"\"create table if not exists orders (\n                    id integer primary key autoincrement,\n                    item text not null,\n                    amount_in_cents int not null,\n                    price_with_tax int not null\n                )\"\"\", []);\n            } catch (DbError e2) {\n                Log.error(f\"schema setup failed: {e2.message}\");\n            }\n        }\n\n        print(f\"Shop API on port {PORT}\");\n        try {\n            Server s = create_server();\n            s.start();\n        } catch (ValueError e) {\n            Log.error(f\"missing ADMIN_TOKEN: {e.message}\");\n            return;\n        }\n\n        Schedule.every(1h, print_order_total, name = \"print order total\");\n        Schedule.run();\n    } catch (IOError e) {\n        Log.error(f\"database open failed: {e.message}\");\n        return;\n    }\n}",
