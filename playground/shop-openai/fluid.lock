    "shop.fluid:to place order": {
      "key": "95254c9267369a7b",
      "fluid_hash": "e714288208e9",
      "fx3": "import Db;\nfrom ./pricing import price_with_tax;\n\nfunction[<string, int>|<int>] @fails(ValueError, IOError, DbError) place_order = Function(string item, int amount_in_cents) {\n    string clean_item = item.trim();\n    if (clean_item == \"\") { fail ValueError(\"item must not be empty\"); }\n    if (amount_in_cents < 0) { fail ValueError(\"amount must not be negative\"); }\n\n    Db db = Db.open(DB_PATH)?;\n    int new_id = 0;\n    int taxed = price_with_tax(amount_in_cents);\n    db.begin()?;\n    bool committed = false;\n    try {\n        db.exec(\"insert into orders (item, amount_in_cents, price_with_tax) values (?, ?, ?)\", [clean_item, amount_in_cents, taxed])?;\n        new_id = db.lastId();\n        db.commit()?;\n        committed = true;\n    } catch (DbError e) {\n        if (not committed) { db.rollback(); }\n        fail e;\n    }\n    return new_id;\n}",
