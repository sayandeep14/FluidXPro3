    "shop.fluid:web": {
      "key": "beb0a8ff2765468e",
      "fluid_hash": "e243040f9cf9",
      "fx3": "import Server;\nimport Env;\nimport Json;\n\nfunction[<Request>|<Response>] @fails(FormatError, IOError, DbError) post_orders = Function(Request req) {\n    Json body = req.json()?;\n    string item = body.get(\"item\").asString() ?? \"\";\n    int amount = body.get(\"amount\").asInt() ?? -1;\n    try {\n        int id = place_order(item, amount);\n        return Response.json({\"id\": id}, status = 201);\n    } catch (ValueError e) {\n        return Response.json({\"error\": e.message}, status = 400);\n    }\n    return Response.error(\"unexpected\", status = 500);\n}\n\nfunction[<Request>|<Response>] @fails(IOError, DbError) get_total = Function(Request req) {\n    int t = order_total()?;\n    return Response.json({\"total\": t});\n}\n\nfunction[<>|<Server>] @fails(ValueError) create_server = Function() {\n    Server s = Server.create(port = PORT);\n    s.requireHeader(\"X-Admin-Token\", Env.require(ADMIN_TOKEN_NAME)?, []);\n    s.post(\"/orders\", post_orders);\n    s.get(\"/total\", get_total);\n    return s;\n}",
