    "shop.fluid:test placing an order adds its taxed price to the total": {
      "key": "c163bfcaf15045e1",
      "fluid_hash": "d83a0f2b87c5",
      "fx3": "import Db;\n\nfunction[<>|<>] @test placing_an_order_adds_its_taxed_price_to_the_total = Function() {\n    try {\n        Db db = Db.open(DB_PATH);\n        db.exec(\"\"\"create table if not exists orders (\n            id integer primary key autoincrement,\n            item text not null,\n            amount_in_cents int not null,\n            price_with_tax int not null\n        )\"\"\", []);\n        db.exec(\"delete from orders\", []);\n        int _ = place_order(\"test\", 100);\n        int total = order_total();\n        ensure(total == 118, \"after placing an order for 100 cents, the order total is 118\");\n    } catch (IOError e) {\n        panic(e.message);\n    } catch (DbError e) {\n        panic(e.message);\n    } catch (ValueError e) {\n        panic(e.message);\n    }\n}",
