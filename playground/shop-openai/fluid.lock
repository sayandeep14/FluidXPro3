    "pricing.fluid:to price with tax": {
      "key": "bf996a7adcfd8f50",
      "fluid_hash": "636ae947c0c3",
      "fx3": "function[<int>|<int>] @example(100 -> 118) @example(0 -> 0) price_with_tax = Function(int amount_in_cents) {\n    ensure(amount_in_cents >= 0, \"amount must not be negative\");\n    int tax = (amount_in_cents * 18 + 50) ~/ 100;  // 18% rounded to nearest cent\n    return amount_in_cents + tax;\n}",
