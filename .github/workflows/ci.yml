name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"        # nightly: a long fuzz run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install bubblewrap (OS-level sandbox on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Which sandbox this runner has
        run: fluid doctor
      - name: Tests
        env:
          FX3_FUZZ_CASES: ${{ github.event_name == 'schedule' && '50000' || '400' }}
        run: python -m pytest -q
      # no API key is configured in CI: fluidc's tests use a scripted model, and live tests are opt-in (-m live)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pyright (ratchet; see tools/typecheck_gate.py)
        run: python tools/typecheck_gate.py
      - name: Generated code is valid Python 3.10
        run: |
          python - <<'PY'
          from pathlib import Path
          from fx3c.driver import compile_source, write_output
          for p in sorted(Path("compilers/fx3c/tests/programs").glob("*.fx3")):
              r = compile_source(p.read_text(encoding="utf-8"), str(p))
              if r.ok:
                  write_output(r.output, Path("build/generated") / p.stem)
          PY
          # syntax errors and undefined names only: style is not the point here
          ruff check build/generated --target-version py310 --isolated --select E9,F63,F7,F82

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: python -m pip install build && python -m build
      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/fluid --version
          /tmp/clean/bin/fluid new smoke && /tmp/clean/bin/fluid doctor smoke
          printf 'function[<>|<>] @entry main = Function() { print("ok"); }\n' > smoke/hi.fx3
          test "$(/tmp/clean/bin/fluid run smoke/hi.fx3)" = "ok"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
