name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches every version number
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          found = {"pyproject.toml": tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]}
          for p in ["compilers/fx3c/fx3c/__init__.py", "compilers/fluidc/fluidc/__init__.py",
                    "compilers/fluid/fluid/__init__.py"]:
              found[p] = re.search(r'__version__ = "([^"]+)"', Path(p).read_text()).group(1)
          bad = {k: v for k, v in found.items() if v != tag}
          assert not bad, f"tag v{tag} doesn't match: {bad}"
          PY
      - run: python -m pip install build && python -m build
      - name: GitHub release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
      # To publish on PyPI, set up trusted publishing for this repository, then add:
      # - uses: pypa/gh-action-pypi-publish@release/v1
